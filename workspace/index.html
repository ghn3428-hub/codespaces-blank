<!DOCTYPE html>
<html>
<head>
  <title>우리의 추억</title>
</head>
<body>

<h1>❤️ 우리의 추억</h1>

<input id="input" placeholder="추억 입력">
<button onclick="add()">추가</button>

<div id="list"></div>

<script>
async function add() {
  const text = document.getElementById("input").value;

  await fetch("/add", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text })
  });

  load();
}

async function load() {
  const res = await fetch("/list");
  const data = await res.json();

  document.getElementById("list").innerHTML =
    data.map(d => `<p>${d}</p>`).join("");
}

load();
</script>
function add() {
  alert("버튼 정상!");
}
</body>
</html>
