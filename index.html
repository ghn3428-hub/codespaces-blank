<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>우리의 대화 💛</title>

<style>
body { margin:0; font-family:-apple-system; background:#b2c7d9; }
.header { background:white; padding:10px; text-align:center; font-weight:bold; }
.chat { height:80vh; overflow-y:auto; padding:10px; }
.msg { display:flex; margin:5px; }
.me { justify-content:flex-end; }
.you { justify-content:flex-start; }
.bubble { padding:10px; border-radius:15px; max-width:60%; }
.me .bubble { background:#ffe812; }
.you .bubble { background:white; }
.input { position:fixed; bottom:0; width:100%; background:white; padding:10px; }
</style>
</head>

<body>

<div class="header">💛 우리의 대화</div>
<div id="chat" class="chat"></div>

<div class="input">
  <select id="who">
    <option value="me">나</option>
    <option value="you">여자친구</option>
  </select>
  <input type="text" id="text">
  <button onclick="send()">전송</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 Firebase config 넣기 */
const firebaseConfig = {
  apiKey: "여기",
  authDomain: "여기",
  projectId: "여기"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 실시간 */
const q = query(collection(db, "chat"), orderBy("time"));

onSnapshot(q, (snapshot) => {
  const chat = document.getElementById("chat");
  chat.innerHTML = "";

  snapshot.forEach(doc => {
    const data = doc.data();

    const div = document.createElement("div");
    div.className = "msg " + data.who;

    div.innerHTML = `
      <div class="bubble">${data.text}</div>
    `;

    chat.appendChild(div);
  });

  chat.scrollTop = chat.scrollHeight;
});

/* 보내기 */
window.send = async function() {
  const text = document.getElementById("text").value;
  const who = document.getElementById("who").value;

  if(!text) return;

  await addDoc(collection(db, "chat"), {
    text,
    who,
    time: Date.now()
  });

  document.getElementById("text").value = "";
}
</script>

</body>
</html>
